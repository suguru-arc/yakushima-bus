<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yakushima Bus Finder</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#232A26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fog:#E4E8E4; --paper:#F7F9F6; --granite:#232A26; --rain:#78867F;
    --moss:#2F6B45; --moss-soft:#DDE9E0; --alert:#A5382A; --alert-soft:#F7E4E0;
    --amber:#8A5A0B; --amber-soft:#F7EEDC; --line:#CAD2CC;
    --sans:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fog); color:var(--granite); font-family:var(--sans);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:760px; margin:0 auto; padding:0 14px 64px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:26px 0 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { margin:0; font-size:19px; font-weight:600; letter-spacing:-.01em; }
  h1 small { display:block; font-family:var(--mono); font-size:11px; font-weight:400;
    letter-spacing:.1em; text-transform:uppercase; color:var(--rain); margin-top:3px; }
  .langs { display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .langs button { font-family:var(--mono); font-size:11px; letter-spacing:.08em; padding:5px 11px;
    border:0; background:transparent; color:var(--rain); cursor:pointer; }
  .langs button[aria-pressed="true"] { background:var(--granite); color:var(--paper); }
  .panel { padding:20px 0 22px; border-bottom:1px solid var(--line); }
  .field { position:relative; margin-bottom:10px; }
  .field > label { display:block; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--rain); margin-bottom:5px; }
  .field input { width:100%; padding:11px 12px; font-family:var(--sans); font-size:16px;
    color:var(--granite); background:var(--paper); border:1px solid var(--line); border-radius:2px; }
  .field input:focus-visible, button:focus-visible, li:focus-visible { outline:2px solid var(--moss); outline-offset:1px; }
  .swap-row { display:flex; justify-content:center; margin:-3px 0 5px; }
  .swap { font-family:var(--mono); font-size:11px; letter-spacing:.06em; background:var(--paper);
    border:1px solid var(--line); border-radius:2px; color:var(--rain); padding:3px 12px; cursor:pointer; }
  .swap:hover { color:var(--moss); border-color:var(--moss); }
  .when { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  .when .field { flex:1 1 132px; min-width:132px; margin-bottom:0; overflow:hidden; }
  .now-btn { flex:0 0 auto; font-family:var(--mono); font-size:10px; letter-spacing:.06em; padding:6px 10px;
    background:var(--fog); border:1px solid var(--line); border-radius:2px; color:var(--granite);
    cursor:pointer; white-space:nowrap; }
  .now-btn:hover { color:var(--moss); border-color:var(--moss); }
  @media (max-width:480px) {
    /* iOS Safariのネイティブdate/time入力はflexboxの縮小計算に従わず、
       指定した幅を無視して独自の幅で描画され隣接要素に重なることがある。
       横並びの幅の奪い合い自体をやめ、縦積みにして確実に回避する。 */
    .when { flex-direction:column; align-items:stretch; }
    .when .field { flex:none; min-width:0; width:100%; }
    .now-btn { align-self:flex-end; width:auto; }
  }
  .map-btn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
    box-sizing:border-box; margin:0 0 14px; padding:11px 12px;
    font-family:var(--sans); font-size:13px; text-align:center; text-decoration:none;
    background:var(--paper); border:1px solid var(--line); border-radius:2px; color:var(--rain); }
  .map-btn svg { flex:0 0 auto; width:15px; height:15px; }
  .map-btn:hover { color:var(--moss); border-color:var(--moss); }
  .go { width:100%; margin-top:14px; padding:13px; font-family:var(--sans); font-size:15px;
    font-weight:500; background:var(--granite); color:var(--paper); border:0; border-radius:2px; cursor:pointer; }
  .go:hover { background:var(--moss); }
  .options { position:absolute; z-index:30; top:100%; left:0; right:0; margin:3px 0 0; padding:0;
    list-style:none; max-height:264px; overflow-y:auto; background:var(--paper);
    border:1px solid var(--granite); border-radius:2px; box-shadow:0 8px 22px rgba(35,42,38,.13); }
  .options[hidden] { display:none; }
  .options li { padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--fog); }
  .options li:last-child { border-bottom:0; }
  .options li[aria-selected="true"], .options li:hover { background:var(--moss-soft); }
  .options .en { font-family:var(--mono); font-size:11px; color:var(--rain); display:block; }
  .options .none { color:var(--rain); cursor:default; }
  .options .none:hover { background:transparent; }
  .status { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; padding:11px 13px;
    margin:18px 0 4px; border-radius:2px; font-size:13.5px; }
  .status .tag { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    padding:2px 6px; border-radius:2px; }
  .status.ok { background:var(--moss-soft); } .status.ok .tag { background:var(--moss); color:#fff; }
  .status.warn { background:var(--amber-soft); } .status.warn .tag { background:var(--amber); color:#fff; }
  .status.stop { background:var(--alert-soft); } .status.stop .tag { background:var(--alert); color:#fff; }
  .status b { font-family:var(--mono); font-weight:600; }
  .board { display:flex; gap:16px; padding-top:14px; align-items:stretch; }
  .ribbon { position:relative; flex:0 0 88px; min-height:460px; border-left:1px solid var(--line);
    border-right:1px solid var(--line); background:var(--paper); }
  .ribbon-head { font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--rain); text-align:center; padding:5px 0; border-bottom:1px solid var(--line); }
  .track { position:relative; height:460px; }
  .hour { position:absolute; left:0; right:0; border-top:1px dashed var(--line); }
  .hour span { position:absolute; left:3px; top:-7px; font-family:var(--mono); font-size:9px;
    color:var(--rain); background:var(--paper); padding:0 1px; }
  .nowline { position:absolute; left:0; right:0; border-top:1.5px solid var(--alert); }
  .nowline span { position:absolute; right:2px; top:-7px; font-family:var(--mono); font-size:8.5px;
    letter-spacing:.06em; color:#fff; background:var(--alert); padding:0 3px; border-radius:1px; }
  .dep { position:absolute; right:4px; font-family:var(--mono); font-size:12px; font-weight:500;
    padding:1px 5px; border:1px solid var(--granite); border-radius:2px; background:var(--paper);
    color:var(--granite); cursor:pointer; transform:translateY(-50%); }
  .dep.past { opacity:.32; border-style:dotted; }
  .dep.last { background:var(--alert); border-color:var(--alert); color:#fff; }
  .dep.last.past { background:var(--paper); color:var(--alert); }
  .results { flex:1; min-width:0; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:2px; padding:13px 14px;
    margin-bottom:9px; animation:rise .22s ease-out both; }
  @keyframes rise { from { opacity:0; transform:translateY(5px); } }
  .card.spot { border-color:var(--moss); box-shadow:0 0 0 1px var(--moss); }
  .card.is-last { border-color:var(--alert); }
  .card-top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:9px; }
  .clock { font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.01em; }
  .arrow { color:var(--rain); font-family:var(--mono); }
  .meta { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--rain); }
  .badge { font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:2px 5px; border-radius:2px; background:var(--alert); color:#fff; }
  .beta-tag { font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
    padding:2px 6px; border-radius:2px; background:var(--amber); color:#fff; vertical-align:middle; margin-left:6px; }
  .leg { display:flex; gap:9px; padding:3px 0; }
  .leg-bar { flex:0 0 3px; background:var(--moss); border-radius:2px; }
  .leg-body { flex:1; min-width:0; font-size:13px; }
  .leg-body .route { font-weight:500; }
  .leg-body .path { color:var(--rain); font-size:12.5px; }
  .leg-body .path b { font-family:var(--mono); font-weight:400; color:var(--granite); }
  .est { font-family:var(--mono); font-size:10px; color:var(--amber); }
  .leg-note { font-size:11.5px; color:var(--amber); background:var(--amber-soft); padding:3px 6px;
    border-radius:2px; margin-top:3px; display:inline-block; }
  .change { display:flex; gap:9px; align-items:center; padding:3px 0; font-family:var(--mono);
    font-size:11px; color:var(--rain); }
  .change::before { content:""; flex:0 0 3px; height:14px;
    background:repeating-linear-gradient(var(--line) 0 2px, transparent 2px 4px); }
  .empty { background:var(--paper); border:1px dashed var(--line); border-radius:2px; padding:26px 16px;
    text-align:center; color:var(--rain); font-size:13.5px; }
  footer { margin-top:26px; padding-top:14px; border-top:1px solid var(--line); font-size:15px;
    color:#000; line-height:1.7; }
  footer #footNote a { color:var(--moss); font-weight:600; }
  footer .updated { margin-top:8px; font-family:var(--mono); font-size:12px; }
  footer .credit { display:flex; justify-content:flex-end; align-items:baseline; gap:8px; margin-top:48px;
    font-family:var(--mono); font-size:11px; letter-spacing:.03em; }
  footer .credit a { display:inline-flex; color:inherit; }
  /* baseline揃えではロゴ下端が「Made by」のベースラインに来るので、ロゴの文字の底辺
     (ロゴ下端から高さの23.8%上、yの下に伸びる部分を除く)が揃うよう下へずらす */
  footer .credit .arc-logo { height:40px; width:auto; transform:translateY(23.8%); }
  @media (max-width:560px) { .ribbon { flex:0 0 78px; } .dep { font-size:11px; padding:1px 3px; } .board { gap:10px; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>

  },
  en:{ title:"Yakushima Bus Finder", subtitle:"Bus route search for Yakushima", from:"From", to:"To", date:"Date", time:"Departing after",
    now:"Current time", go:"Find buses", noStop:"No matching stop",
    direct:"Direct", transfer:"change", change:"Change at", last:"Last", lastBadge:"Last",
    okTag:"Running", warnTag:"Few left", stopTag:"Finished",
    lastOf:"Last bus departs", few:"Only", fewAfter:"left today. Don\'t miss it.",
    none:"No more buses today on this route.", nextDay:"First bus tomorrow", nextDayAfter:".",
    emptyPick:"Choose where you\'re starting and where you\'re going.",
    emptyNone:"No bus connects these stops. Try another date.",
    ribbon:"Today", min:"min", est:"(est)", mapBtn:"Find stops on the map",
    officialBtn:"Check the official timetable",
    foot:`This tool was developed unofficially, with no connection to the bus company, to help tourists who find Yakushima's bus information hard to follow. It is based on the official timetable, but <b>updates from the bus company may not be reflected yet, and because it has not been fully verified, actual times or bus stop locations may differ.</b> If you need more reliable information, please check the official sources.<br>We cannot take responsibility for any mistakes, but if you let us know about one, we will use it to improve the tool. If you notice an error, please report it <a href="${LINKS.form}" target="_blank" rel="noopener">here</a>.`,
    updated:"Last updated", arcUrl:"https://www.arc-yakushima.com/en/",
  }
};
let LANG = (navigator.language||"").toLowerCase().startsWith("ja") ? "ja" : "en";
const T = () => UI[LANG];
const S = {}; STOPS.forEach(s => S[s.id]=s);
// 公式路線図・時刻表に印字されている停留所番号("s20"->"20")を名前の先頭に付与する
const dispNameOf = s => `${s.id.slice(1)} ${LANG==="ja"?s.ja:s.en}`;
const nameOf = id => S[id] ? dispNameOf(S[id]) : id;
const routeOf = id => ROUTES.find(r=>r.id===id) || {ja:id,en:id};
const routeName = id => LANG==="ja"?routeOf(id).ja:routeOf(id).en;
const routeNote = id => LANG==="ja"?routeOf(id).note_ja:routeOf(id).note_en;
const headOf = t => LANG==="ja"?t.head_ja:t.head_en;
const t2m = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const fmt = m => String(Math.floor((m%1440)/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

TRIPS.forEach(t => { t.seq=Object.keys(t.times); t.idx={}; t.seq.forEach((s,i)=>t.idx[s]=i); t.estSet=new Set(t.est); });
const routesAtStop={};
TRIPS.forEach(t=>t.seq.forEach(s=>{(routesAtStop[s]=routesAtStop[s]||new Set()).add(t.route);}));
const HUBS=Object.keys(routesAtStop).filter(s=>routesAtStop[s].size>1);
const runsOn=(t,d)=>(CAL[t.service]||[]).includes(d.getDay());
const legOf=(t,i,j)=>({route:t.route,trip:t,from:t.seq[i],to:t.seq[j],
  dep:t2m(t.times[t.seq[i]]),arr:t2m(t.times[t.seq[j]]),depEst:t.estSet.has(t.seq[i]),arrEst:t.estSet.has(t.seq[j])});

function journeys(from,to,date,after){
  const active=TRIPS.filter(t=>runsOn(t,date)); const out=[];
  for(const t of active){ const i=t.idx[from],j=t.idx[to];
    if(i===undefined||j===undefined||j<=i) continue;
    const dep=t2m(t.times[t.seq[i]]); if(dep<after) continue;
    out.push({legs:[legOf(t,i,j)],dep,arr:t2m(t.times[t.seq[j]])}); }
  for(const hub of HUBS){ if(hub===from||hub===to) continue;
    for(const a of active){ const i=a.idx[from],h=a.idx[hub];
      if(i===undefined||h===undefined||h<=i) continue;
      const toOnA=a.idx[to]; if(toOnA!==undefined&&toOnA<=h) continue; // このトリップが既にtoを経由するなら乗換不要
      const dep=t2m(a.times[a.seq[i]]); if(dep<after) continue;
      const arrH=t2m(a.times[a.seq[h]]);
      for(const b of active){ if(b===a) continue;
        const h2=b.idx[hub],j=b.idx[to];
        if(h2===undefined||j===undefined||j<=h2) continue;
        const depH=t2m(b.times[b.seq[h2]]); if(depH<arrH+CONFIG.minTransfer) continue;
        out.push({legs:[legOf(a,i,h),legOf(b,h2,j)],dep,arr:t2m(b.times[b.seq[j]])}); } } }
  // 下のループは後ろから走査するので、同じ出発時刻の中では「到着が早い・乗換が少ない」候補が
  // 先に見えるよう到着・乗換回数は降順に並べる(昇順だと劣る候補から先に見えて全部残ってしまう)
  out.sort((x,y)=>x.dep-y.dep||y.arr-x.arr||y.legs.length-x.legs.length);
  const keep=[]; let best=Infinity;
  for(let k=out.length-1;k>=0;k--){ if(out[k].arr<best){keep.unshift(out[k]);best=out[k].arr;} }
  return keep;
}

function combobox(inputEl,listEl,onPick){
  let picked=null,cursor=-1,shown=[];
  const match=q=>{ q=q.trim().toLowerCase().replace(/^\d+\s+/,""); if(!q) return STOPS.slice();
    // score: 4=停留所番号が完全一致, 3=en/roma word starts with q, 2=ja/番号が前方一致, 1=any substring
    const qIsNum=/^\d+$/.test(q);
    const scored=[];
    for(const s of STOPS){
      const num=s.id.slice(1);
      const en=s.en.toLowerCase(), ja=s.ja, romaWords=s.roma.toLowerCase().split(" ");
      let sc=0;
      if(qIsNum&&num===q) sc=4;
      else if(en.startsWith(q)||romaWords.some(w=>w.startsWith(q))) sc=3;
      else if(ja.startsWith(q)||(qIsNum&&num.startsWith(q))) sc=2;
      else if(ja.includes(q)||en.includes(q)||s.roma.toLowerCase().includes(q)) sc=1;
      if(sc) scored.push([sc,s]);
    }
    scored.sort((a,b)=>b[0]-a[0]);
    return scored.map(x=>x[1]); };
  const render=()=>{ listEl.innerHTML="";
    if(!shown.length){ const li=document.createElement("li"); li.className="none"; li.textContent=T().noStop; listEl.appendChild(li); return; }
    shown.forEach((s,i)=>{ const li=document.createElement("li"); li.role="option";
      li.setAttribute("aria-selected",i===cursor);
      li.innerHTML=`${dispNameOf(s)}<span class="en">${LANG==="ja"?s.en:s.ja}</span>`;
      li.onmousedown=e=>{e.preventDefault();choose(s);}; listEl.appendChild(li); }); };
  const open=()=>{ shown=match(inputEl.value); cursor=-1; render(); listEl.hidden=false; inputEl.ariaExpanded="true"; };
  const close=()=>{ listEl.hidden=true; inputEl.ariaExpanded="false"; };
  const choose=s=>{ picked=s.id; inputEl.value=dispNameOf(s); close(); onPick&&onPick(); };
  inputEl.addEventListener("focus",open);
  inputEl.addEventListener("input",()=>{picked=null;open();});
  inputEl.addEventListener("blur",()=>setTimeout(close,120));
  inputEl.addEventListener("keydown",e=>{
    if(listEl.hidden&&(e.key==="ArrowDown"||e.key==="ArrowUp")){open();return;}
    if(e.key==="ArrowDown"){e.preventDefault();cursor=Math.min(cursor+1,shown.length-1);render();}
    else if(e.key==="ArrowUp"){e.preventDefault();cursor=Math.max(cursor-1,0);render();}
    else if(e.key==="Enter"&&cursor>=0&&shown[cursor]){e.preventDefault();choose(shown[cursor]);}
    else if(e.key==="Escape")close(); });
  return { get:()=>picked,
    set:id=>{const s=S[id]; if(s){picked=id;inputEl.value=dispNameOf(s);}},
    refresh:()=>{if(picked){const s=S[picked];inputEl.value=dispNameOf(s);}} };
}

const $=id=>document.getElementById(id);
const fromBox=combobox($("fromInput"),$("fromList"),()=>run());
const toBox=combobox($("toInput"),$("toList"),()=>run());

function labels(){ const t=T(); document.documentElement.lang=LANG;
  $("title").textContent=t.title; $("lblFrom").textContent=t.from; $("lblTo").textContent=t.to;
  $("lblDate").textContent=t.date; $("lblTime").textContent=t.time; $("nowBtn").textContent=t.now;
  $("goBtn").textContent=t.go; $("ribbonHead").textContent=t.ribbon; $("mapBtnText").textContent=t.mapBtn;
  $("subtitle").textContent=t.subtitle; $("officialBtnText").textContent=t.officialBtn;
  $("footNote").innerHTML=t.foot;
  $("footUpdated").textContent=`${t.updated}${LANG==="ja"?"：":": "}${CONFIG.updated}`;
  $("arcLink").href=t.arcUrl;
  $("langJa").ariaPressed=LANG==="ja"; $("langEn").ariaPressed=LANG==="en"; }
function setNow(){ const d=new Date(); $("dateInput").value=d.toISOString().slice(0,10);
  $("timeInput").value=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

function run(){
  const from=fromBox.get(),to=toBox.get(),t=T();
  const res=$("results"),track=$("track"),status=$("status");
  status.innerHTML=""; track.innerHTML="";
  if(!from||!to||from===to){ res.innerHTML=`<div class="empty">${t.emptyPick}</div>`; return; }
  const date=new Date($("dateInput").value+"T00:00:00"); if(isNaN(date)){setNow();return;}
  const after=t2m($("timeInput").value||"00:00");
  const all=journeys(from,to,date,-1);
  if(!all.length){ res.innerHTML=`<div class="empty">${t.emptyNone}</div>`; return; }
  const upcoming=all.filter(j=>j.dep>=after); const lastJ=all[all.length-1];
  const strip=document.createElement("div");
  if(!upcoming.length){ const tmr=new Date(date); tmr.setDate(tmr.getDate()+1);
    const first=journeys(from,to,tmr,-1)[0]; strip.className="status stop";
    strip.innerHTML=`<span class="tag">${t.stopTag}</span><span>${t.none}`+(first?` ${t.nextDay} <b>${fmt(first.dep)}</b>${t.nextDayAfter}`:"")+`</span>`;
  } else if(upcoming.length<=2){ strip.className="status warn";
    strip.innerHTML=`<span class="tag">${t.warnTag}</span><span>${t.few} <b>${upcoming.length}</b>${LANG==="ja"?"":" bus"} ${t.fewAfter}</span><span class="meta">${t.lastOf} <b>${fmt(lastJ.dep)}</b></span>`;
  } else { strip.className="status ok";
    strip.innerHTML=`<span class="tag">${t.okTag}</span><span>${t.lastOf} <b>${fmt(lastJ.dep)}</b></span>`; }
  status.appendChild(strip);
  const H=460,span=CONFIG.dayEnd-CONFIG.dayStart;
  const y=m=>Math.max(6,Math.min(H-6,(m-CONFIG.dayStart)/span*H));
  for(let h=Math.ceil(CONFIG.dayStart/60);h<=CONFIG.dayEnd/60;h+=2){
    const g=document.createElement("div"); g.className="hour"; g.style.top=y(h*60)+"px";
    g.innerHTML=`<span>${String(h).padStart(2,"0")}</span>`; track.appendChild(g); }
  const today=new Date();
  if(today.toISOString().slice(0,10)===$("dateInput").value){
    const nm=today.getHours()*60+today.getMinutes();
    if(nm>=CONFIG.dayStart&&nm<=CONFIG.dayEnd){ const n=document.createElement("div");
      n.className="nowline"; n.style.top=y(nm)+"px"; n.innerHTML=`<span>NOW</span>`; track.appendChild(n); } }
  let lastY=-99;
  all.forEach((j,i)=>{ const chip=document.createElement("button"); const isLast=j===lastJ;
    chip.className="dep"+(j.dep<after?" past":"")+(isLast?" last":""); chip.textContent=fmt(j.dep);
    let py=y(j.dep); if(py-lastY<20)py=lastY+20; lastY=py; chip.style.top=py+"px"; chip.dataset.i=i;
    chip.onclick=()=>{ const card=res.querySelector(`[data-i="${i}"]`);
      if(card){ res.querySelectorAll(".card").forEach(c=>c.classList.remove("spot"));
        card.classList.add("spot"); card.scrollIntoView({behavior:"smooth",block:"center"}); } };
    track.appendChild(chip); });
  res.innerHTML="";
  const list=(upcoming.length?upcoming:[]).slice(0,CONFIG.maxResults);
  if(!list.length){ res.innerHTML=`<div class="empty">${t.none}</div>`; return; }
  const est=b=>b?`<span class="est">${t.est}</span>`:"";
  list.forEach(j=>{ const i=all.indexOf(j); const card=document.createElement("div");
    card.className="card"+(j===lastJ?" is-last":""); card.dataset.i=i;
    const dur=j.arr-j.dep;
    // fare = sum of each leg (each boarding is charged separately on Yakushima)
    let fare=0, fareOk=true;
    j.legs.forEach(l=>{ const fv=fareFor(l.from,l.to); if(fv==null) fareOk=false; else fare+=fv; });
    const fareStr = (fareOk && fare>0) ? " · &#8776;&yen;"+fare : "";
    let html=`<div class="card-top"><span class="clock">${fmt(j.dep)}</span>${est(j.legs[0].depEst)}<span class="arrow">&#8594;</span><span class="clock">${fmt(j.arr)}</span>${est(j.legs[j.legs.length-1].arrEst)}${j===lastJ?`<span class="badge">${t.lastBadge}</span>`:""}<span class="meta">${dur}${LANG==="ja"?t.min:" "+t.min} · ${j.legs.length===1?t.direct:"1 "+t.transfer}${fareStr}</span></div>`;
    j.legs.forEach((leg,k)=>{ if(k>0){ const wait=leg.dep-j.legs[k-1].arr;
        html+=`<div class="change">${t.change} ${nameOf(leg.from)} · ${wait}${LANG==="ja"?t.min:" "+t.min}</div>`; }
      const note=routeNote(leg.route);
      const lf=fareFor(leg.from,leg.to);
      const lfStr = lf ? ` <span style="color:var(--rain);font-family:var(--mono);font-size:11px">&#8776;&yen;${lf}</span>` : "";
      html+=`<div class="leg"><div class="leg-bar"></div><div class="leg-body"><div class="route">${routeName(leg.route)} <span style="color:var(--rain);font-weight:400">${headOf(leg.trip)}</span>${lfStr}</div><div class="path"><b>${fmt(leg.dep)}</b>${est(leg.depEst)} ${nameOf(leg.from)} &#8594; <b>${fmt(leg.arr)}</b>${est(leg.arrEst)} ${nameOf(leg.to)}</div>${note?`<div class="leg-note">${note}</div>`:""}</div></div>`; });
    card.innerHTML=html; res.appendChild(card); });
}

$("langJa").onclick=()=>{LANG="ja";labels();fromBox.refresh();toBox.refresh();run();};
$("langEn").onclick=()=>{LANG="en";labels();fromBox.refresh();toBox.refresh();run();};
$("swapBtn").onclick=()=>{const a=fromBox.get(),b=toBox.get();fromBox.set(b);toBox.set(a);run();};
$("nowBtn").onclick=()=>{setNow();run();};
$("goBtn").onclick=run; $("dateInput").onchange=run; $("timeInput").onchange=run;
// AndroidはGoogleマップアプリを直接起動させる(未インストール時はPlayストアへ)。
// iOSはUniversal Linksの仕組み上OSが自動判定するため、ここでは何もしない
// (マイマップはiOS版Googleマップアプリの対応対象外のことがあり、その場合は
// ブラウザで開かれる。アプリ側の制約でありJS側からは強制できない)。
if(/Android/i.test(navigator.userAgent)){
  $("mapBtn").addEventListener("click",e=>{
    e.preventDefault();
    const url=$("mapBtn").href;
    const intent=`intent://${url.replace(/^https?:\/\//,"")}#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    location.href=intent;
  });
}
labels(); setNow(); fromBox.set("s105"); toBox.set("s20"); run();

// オフライン対応: 一度開けば電波の入らない山間部でもそのまま使えるようにする。
// file://で開いた場合やhttpの非localhostではService Workerは動作しないため、
// その場合は何もしない(エラーは出さない)。
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
